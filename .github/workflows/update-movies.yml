name: Update verified Korean and Chinese Hindi drama catalog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-central-movies
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Discover videos with YouTube Data API and verify full-length metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const API_KEY = process.env.YOUTUBE_API_KEY;
          if (!API_KEY) {
            console.error('YOUTUBE_API_KEY secret is missing. Add it in Settings > Secrets and variables > Actions.');
            process.exit(1);
          }

          const MIN_SECONDS = 40 * 60;
          const MAX_CANDIDATES_PER_SOURCE = 50;
          const PLAYLIST_PAGES_PER_CHANNEL = 3;
          const MAX_CATALOG = 300;
          const channels = [
            { id: 'UCeT3qfOyeMOgRcBhzF4xA7Q', name: 'Drama Central - Hindi' },
            { id: 'UC2lLHs_L-bVRaJvaKLP7gXA', name: 'Dyar Entertainment' },
            { id: 'UCPq5WYTfdvimNtliUDwNI3Q', name: 'World Movies Local Hindi' },
            { id: 'UCWpl0xU2QoCilabHBfT0YBQ', name: 'CCAP Hindi' },
            { id: 'UCqNZfgKhq6aQgyHX0G1rimA', name: 'Divya Drishti TV Hindi' }
          ];
          const blocked = /#shorts?|\bshorts?\b|trailer|teaser|promo|official\s*clip|\bclip\b/i;
          const hindi = /hindi|हिंदी|हिन्दी|dubbed|\bdub\b/i;
          const region = /korean|\bk\s*[- ]?drama\b|chinese|\bc\s*[- ]?drama\b|cdrama|kdrama|कोरियन|कोरियाई|चाइनीज|चीनी/i;
          const fullFeature = /full\s*(movie|drama|film)|complete\s*(movie|drama|film)|full[- ]length|पूरी\s*(फिल्म|मूवी|ड्रामा)|संपूर्ण\s*(फिल्म|मूवी)/i;

          async function api(path, params = {}) {
            const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
            for (const [k,v] of Object.entries({ ...params, key: API_KEY })) {
              if (v !== undefined && v !== null && v !== '') u.searchParams.set(k, String(v));
            }
            const res = await fetch(u);
            const body = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error('YouTube API ' + path + ' HTTP ' + res.status + ': ' + JSON.stringify(body.error || body));
            return body;
          }

          function durationSeconds(iso) {
            const m = String(iso || '').match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
            return m ? Number(m[1]||0)*3600 + Number(m[2]||0)*60 + Number(m[3]||0) : 0;
          }

          async function main() {
            const old = JSON.parse(fs.readFileSync('movies.json', 'utf8'));
            const existing = (old.movies || []).filter(x =>
              x && (x.videoId || x.youtubeId) &&
              Number(x.durationSeconds) >= MIN_SECONDS &&
              x.verifiedBy === 'YouTube Data API v3 metadata'
            );

            const candidates = new Map();
            function addCandidate(id, sourceHint) {
              if (id && !candidates.has(id)) candidates.set(id, { videoId: id, sourceHint: sourceHint || 'YouTube Data API search' });
            }

            // Two broad discovery searches, 50 results each as requested.
            for (const q of [
              'Korean drama Hindi dubbed full movie',
              'Chinese drama Hindi dubbed full movie'
            ]) {
              const data = await api('search', {
                part: 'snippet', q, type: 'video', videoDuration: 'long',
                maxResults: MAX_CANDIDATES_PER_SOURCE, order: 'relevance'
              });
              for (const item of data.items || []) addCandidate(item.id && item.id.videoId, item.snippet && item.snippet.channelTitle);
              console.log('Search query:', q, 'returned:', (data.items || []).length);
            }

            // Fetch each approved channel's uploads playlist, then paginate up to three
            // 50-item pages per channel so discovery is not limited to the RSS 15-item window.
            const channelData = await api('channels', {
              part: 'contentDetails,snippet',
              id: channels.map(x => x.id).join(','),
              maxResults: 50
            });
            for (const channel of channels) {
              const ch = (channelData.items || []).find(x => x.id === channel.id);
              const uploads = ch && ch.contentDetails && ch.contentDetails.relatedPlaylists && ch.contentDetails.relatedPlaylists.uploads;
              if (!uploads) {
                console.warn('Uploads playlist unavailable for', channel.name);
                continue;
              }
              let pageToken = '';
              for (let page = 0; page < PLAYLIST_PAGES_PER_CHANNEL; page++) {
                const data = await api('playlistItems', {
                  part: 'contentDetails,snippet', playlistId: uploads,
                  maxResults: 50, pageToken
                });
                for (const item of data.items || []) {
                  const id = item.contentDetails && item.contentDetails.videoId;
                  addCandidate(id, channel.name);
                }
                pageToken = data.nextPageToken || '';
                if (!pageToken) break;
              }
              console.log('Uploads scanned:', channel.name);
            }

            const ids = [...candidates.keys()];
            console.log('Unique candidate IDs:', ids.length);
            const verified = [];
            for (let i = 0; i < ids.length; i += 50) {
              const batch = ids.slice(i, i + 50);
              const data = await api('videos', {
                part: 'snippet,contentDetails,status',
                id: batch.join(','),
                maxResults: 50
              });
              for (const v of data.items || []) {
                const sn = v.snippet || {};
                const title = sn.title || '';
                const description = sn.description || '';
                const text = title + ' ' + description;
                const secs = durationSeconds(v.contentDetails && v.contentDetails.duration);
                const channel = channels.find(c => c.id === sn.channelId);
                const isHindiDub = hindi.test(text);
                const isKoreanChinese = region.test(text) || Boolean(channel);
                const isFullMovieLabelled = fullFeature.test(title);
                if (secs < MIN_SECONDS || v.status?.embeddable !== true ||
                    blocked.test(title) || !isHindiDub || !isKoreanChinese || !isFullMovieLabelled) continue;

                const h = Math.floor(secs / 3600);
                const m = Math.floor((secs % 3600) / 60);
                const label = (h ? h + 'h ' : '') + m + 'm';
                const thumb = sn.thumbnails?.maxres?.url || sn.thumbnails?.high?.url ||
                  ('https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg');
                verified.push({
                  videoId: v.id, title,
                  publishedAt: sn.publishedAt || '',
                  thumbnail: thumb,
                  durationSeconds: secs,
                  durationLabel: label,
                  displayDurationLabel: '🎬 ' + label + ' • सत्यापित Full Drama (40+ min)',
                  source: channel ? channel.name : (candidates.get(v.id)?.sourceHint || 'YouTube Data API search'),
                  category: 'drama',
                  tags: ['Hindi Dubbed', 'Korean/Chinese'],
                  embeddable: true,
                  verifiedBy: 'YouTube Data API v3 metadata',
                  verifiedAt: new Date().toISOString()
                });
              }
            }

            verified.sort((a,b) => Date.parse(b.publishedAt || 0) - Date.parse(a.publishedAt || 0));
            const seen = new Set();
            const merged = verified.concat(existing).filter(x => {
              const id = x.videoId || x.youtubeId;
              if (!id || seen.has(id)) return false;
              seen.add(id);
              return true;
            }).slice(0, MAX_CATALOG);

            fs.writeFileSync('movies.json', JSON.stringify({
              schemaVersion: 1,
              updatedAt: new Date().toISOString(),
              source: 'YouTube Data API search.list + channel uploads playlists + videos.list metadata verification',
              minimumDurationSeconds: MIN_SECONDS,
              movies: merged
            }, null, 2) + '\n');

            console.log('New verified embeddable 40+ minute full dramas:', verified.length);
            console.log('Old verified entries retained:', existing.length);
            console.log('Final unique catalog size:', merged.length);
            if (merged.length < 80) {
              console.warn('Catalog has fewer than 80 verified eligible videos. No fake or unverified entries were added; the real eligible result count is ' + merged.length + '.');
            }
          }

          main().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Commit updated catalog
        run: |
          if git diff --quiet -- movies.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies.json
          git commit -m "chore: refresh verified Hindi Korean Chinese drama catalog"
          git push
