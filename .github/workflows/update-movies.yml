name: Update central Hindi drama catalog

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - ".github/workflows/update-movies.yml"
      - "movies.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-central-movies
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build movies.json from public YouTube RSS feeds (no API key)
        run: |
          node <<'NODE'
          const fs = require('fs');
          const channels = [
            { id: 'UCeT3qfOyeMOgRcBhzF4xA7Q', name: 'Drama Central - Hindi' },
            { id: 'UC2lLHs_L-bVRaJvaKLP7gXA', name: 'Dyar Entertainment' },
            { id: 'UCPq5WYTfdvimNtliUDwNI3Q', name: 'World Movies Local Hindi' }
          ];
          const blocked = new RegExp('#shorts?|\\\\bshorts?\\\\b|trailer|teaser|promo|official\\\\s*clip', 'i');
          const relevant = title => /hindi|हिंदी|हिन्दी|dubbed|dub\\b/i.test(title) &&
            /korean|k\\s*[- ]?drama|chinese|c\\s*[- ]?drama|cdrama|कोरियन|कोरियाई|चाइनीज|चीनी|drama|movie|film|episode/i.test(title) &&
            !blocked.test(title);
          const decode = s => s.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
          async function main() {
            const old = JSON.parse(fs.readFileSync('movies.json','utf8'));
            const byId = new Map((old.movies || []).map(x => [x.videoId || x.youtubeId, x]).filter(x => x[0]));
            let fresh = [];
            for (const ch of channels) {
              try {
                const res = await fetch('https://www.youtube.com/feeds/videos.xml?channel_id=' + ch.id);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const xml = await res.text();
                const entries = xml.split('<entry>').slice(1).map(x => x.split('</entry>')[0]);
                for (const block of entries) {
                  const get = tag => { const re = new RegExp('<' + tag + '(?:\\\\s[^>]*)?>([\\\\s\\\\S]*?)</' + tag + '>'); const m = block.match(re); return m ? decode(m[1].replace(/<!\\\\[CDATA\\\\[|\\\\]\\\\]>/g,'').trim()) : ''; };
                  const id = get('yt:videoId'), title = get('title'), publishedAt = get('published');
                  const thumb = block.match(/<media:thumbnail[^>]*url="([^"]+)"/);
                  if (!id || !title || !relevant(title)) continue;
                  fresh.push({videoId:id,title,publishedAt,thumbnail:thumb?thumb[1]:'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg',
                    durationLabel:'▶ YouTube • नया अपलोड',source:ch.name,category:'drama',tags:['Hindi Dubbed','Korean/Chinese'],feedItem:true});
                }
                console.log('Fetched RSS:', ch.name);
              } catch (e) { console.warn('RSS feed skipped:', ch.name, e.message); }
            }
            const seen = new Set();
            fresh.sort((a,b) => Date.parse(b.publishedAt||0)-Date.parse(a.publishedAt||0));
            const merged = fresh.concat([...byId.values()].sort((a,b) => Date.parse(b.publishedAt||0)-Date.parse(a.publishedAt||0)))
              .filter(x => { const id=x.videoId||x.youtubeId; if(!id||seen.has(id)) return false; seen.add(id); return true; }).slice(0,300);
            fs.writeFileSync('movies.json',JSON.stringify({schemaVersion:1,updatedAt:new Date().toISOString(),
              source:'Public YouTube channel RSS feeds + previous catalog (no API key)',minimumDurationSeconds:0,movies:merged},null,2)+'\\n');
            console.log('Catalog updated with',fresh.length,'RSS uploads; total',merged.length);
          }
          main().catch(e => {console.error(e);process.exit(1);});
          NODE

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- movies.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies.json
          git commit -m "chore: refresh central movie catalog"
          git push
