window.rollLudoDice = async () => {
  if (!ludoState || ludoState.turn !== myColor || ludoState.rolled || isAnimating) return;
  playLudoSound("dice");
  const val = Math.floor(Math.random() * 6) + 1;
  const myTokens = ludoState.tokens[myColor];
  const canMove = myTokens.some(pos => (pos === -1 && val === 6) || (pos >= 0 && pos + val <= 56));
  const order = Object.keys(ludoState.players);
  if (!canMove) {
    await updateDoc(doc(db, 'ludo_rooms', ludoRoomId), { dice: val, rolled: true });
    setTimeout(async () => {
      const nextTurn = order[(order.indexOf(myColor) + 1) % order.length];
      await updateDoc(doc(db, 'ludo_rooms', ludoRoomId), { turn: nextTurn, rolled: false, dice: 0 });
    }, 1100);
  } else {
    await updateDoc(doc(db, 'ludo_rooms', ludoRoomId), { dice: val, rolled: true });
  }

window.moveLudoToken = async (color, idx) => {
  if (!ludoState || color !== myColor || ludoState.turn !== myColor || !ludoState.rolled || isAnimating) return;
  const dice = ludoState.dice;
  let pos = ludoState.tokens[color][idx];
  if (pos === -1 && dice !== 6) return;
  if (pos >= 0 && pos + dice > 56) return;

  isAnimating = true;
  const steps = pos === -1 ? 1 : dice;
  let tempTokens = JSON.parse(JSON.stringify(ludoState.tokens));

  // STEP-BY-STEP SLOW MOVEMENT WITH SOUND
  for (let s = 0; s < steps; s++) {
    pos = (pos === -1) ? 0 : pos + 1;
    tempTokens[color][idx] = pos;
    ludoState.tokens = tempTokens;
    playLudoSound("step");
    renderLudoBoard();
    await new Promise(r => setTimeout(r, 360));
  }

  if (pos === 56) playLudoSound("win");
  const order = Object.keys(ludoState.players);
  const extraTurn = (dice === 6 || pos === 56);
  const nextTurn = extraTurn ? myColor : order[(order.indexOf(myColor) + 1) % order.length];
  isAnimating = false;
  await updateDoc(doc(db, 'ludo_rooms', ludoRoomId), { tokens: tempTokens, turn: nextTurn, rolled: false, dice: 0 });
};

function attachRoomVoiceCall(call, peerLabel) {
  const key = String(peerLabel) + '_' + Math.random().toString(36).slice(2);
  const audio = document.createElement('audio'); audio.autoplay = true; audio.playsInline = true;
  audio.dataset.roomVoice = key; audio.style.display = 'none'; document.body.appendChild(audio);
  roomVoiceAudio.set(key, audio);
  call.on('stream', stream => { audio.srcObject = stream; audio.play().catch(()=>{}); });
  const cleanup = () => { audio.srcObject=null; audio.remove(); roomVoiceAudio.delete(key); roomVoiceCalls=roomVoiceCalls.filter(c=>c!==call); };
  call.on('close', cleanup); call.on('error', cleanup); roomVoiceCalls.push(call);
}
function stopRoomVoice() {
  roomVoiceCalls.forEach(c=>{try{c.close();}catch(e){}}); roomVoiceCalls=[];
  roomVoicePendingCalls.forEach(p=>{try{p.call.close();}catch(e){}}); roomVoicePendingCalls=[];
  roomVoiceAudio.forEach(a=>{a.srcObject=null;a.remove();}); roomVoiceAudio.clear();
  if(roomVoiceStream) roomVoiceStream.getTracks().forEach(t=>t.stop());
  roomVoiceStream=null; ludoStream=null; ludoCalls=[];
  roomVoiceMode=null; roomVoiceRoomId=null; roomVoicePeerIds.clear();
}
async function startRoomVoice(mode, roomId, players) {
  if(!peer||!myPeerId) return alert('Voice connection is still starting. Please try again.');
  if(roomVoiceStream&&(roomVoiceMode!==mode||roomVoiceRoomId!==roomId)) stopRoomVoice();
  if(!roomVoiceStream) {
    try { roomVoiceStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
    catch(e) { alert('Microphone permission is needed for voice chat.'); return; }
    roomVoiceMode=mode; roomVoiceRoomId=roomId; ludoStream=roomVoiceStream;
  }
  const pending = roomVoicePendingCalls.filter(p=>p.meta.roomType===mode&&p.meta.roomId===roomId);
  roomVoicePendingCalls = roomVoicePendingCalls.filter(p=>!(p.meta.roomType===mode&&p.meta.roomId===roomId));
  pending.forEach(({call,meta})=>{call.answer(roomVoiceStream);attachRoomVoiceCall(call,meta.peerId||'friend');});
  Object.values(players||{}).forEach(p=>{
    if(!p||p.uid===currentUser.uid||!p.peerId||roomVoicePeerIds.has(p.peerId)||myPeerId.localeCompare(p.peerId)>0) return;
    roomVoicePeerIds.add(p.peerId);
    const call=peer.call(p.peerId,roomVoiceStream,{metadata:{kind:'roomvoice',roomType:mode,roomId,peerId:myPeerId}});
    if(call) attachRoomVoiceCall(call,p.peerId);
  });
}

function getCellCoord(color, pos, idx) {
  if (pos === -1) return BASE_SPOTS[color][idx];
  if (pos >= 51) return HOME_PATHS[color][pos - 51];
  const globalIdx = (START_OFFSET[color] + pos) % 52;
  return MAIN_PATH[globalIdx];
}

function renderLudoBoard() {
  if (activeTab !== 'ludo') return;
  const box = $('listArea');
  if (!ludoState || !box) return;
  const tokenMap = {};
  ['red','green','yellow','blue'].forEach(color => {
    if (!ludoState.players[color]) return;
    (ludoState.tokens[color] || []).forEach((pos, idx) => {
      const [r, col] = getCellCoord(color, pos, idx);
      const key = `${r},${col}`;
      (tokenMap[key] ||= []).push({color,idx});
    });
  });
  const colorClass = {red:'red',green:'green',yellow:'yellow',blue:'blue'};
  const safe = new Set(SAFE_CELLS);
  let cellsHtml = '';
  for (let r=0;r<15;r++) for (let c=0;c<15;c++) {
    let cls='track';
    if (r<6&&c<6) cls=(r>=1&&r<=4&&c>=1&&c<=4)?'yard yard-red':'home-red';
    else if (r<6&&c>8) cls=(r>=1&&r<=4&&c>=10&&c<=13)?'yard yard-green':'home-green';
    else if (r>8&&c<6) cls=(r>=10&&r<=13&&c>=1&&c<=4)?'yard yard-blue':'home-blue';
    else if (r>8&&c>8) cls=(r>=10&&r<=13&&c>=10&&c<=13)?'yard yard-yellow':'home-yellow';
    if ((r===7&&c>=1&&c<=5)||(r===6&&c===1)) cls='lane-red';
    if ((c===7&&r>=1&&r<=5)||(r===1&&c===8)) cls='lane-green';
    if ((r===7&&c>=9&&c<=13)||(r===8&&c===13)) cls='lane-yellow';
    if ((c===7&&r>=9&&r<=13)||(r===13&&c===6)) cls='lane-blue';
    if (r>=6&&r<=8&&c>=6&&c<=8) cls='center-under';
    const key=`${r},${c}`;
    const tokens=tokenMap[key]||[];
    const tokenHtml=tokens.map(t=>`<button aria-label="${t.color} token" onclick="moveLudoToken('${t.color}',${t.idx})" class="ludo-token ${colorClass[t.color]}"><span></span></button>`).join('');
    const yardColor = cls.includes('yard-red')?'red':cls.includes('yard-green')?'green':cls.includes('yard-blue')?'blue':cls.includes('yard-yellow')?'yellow':null;
    const yardIdx = yardColor ? BASE_SPOTS[yardColor].findIndex(([rr,cc])=>rr===r&&cc===c) : -1;
    const yardSpot = yardIdx >= 0;
    const yardEdge = yardColor ? [
      (yardColor==='red'&&r===1)||(yardColor==='green'&&r===1)||(yardColor==='blue'&&r===10)||(yardColor==='yellow'&&r===10) ? 'yard-edge-top':'',
      (yardColor==='red'&&r===4)||(yardColor==='green'&&r===4)||(yardColor==='blue'&&r===13)||(yardColor==='yellow'&&r===13) ? 'yard-edge-bottom':'',
      (yardColor==='red'&&c===1)||(yardColor==='blue'&&c===1)||(yardColor==='green'&&c===10)||(yardColor==='yellow'&&c===10) ? 'yard-edge-left':'',
      (yardColor==='red'&&c===4)||(yardColor==='blue'&&c===4)||(yardColor==='green'&&c===13)||(yardColor==='yellow'&&c===13) ? 'yard-edge-right':''
    ].filter(Boolean).join(' ') : '';
    if (yardEdge) cls += ' '+yardEdge;
    const yardDot = yardSpot ? `<button aria-label="${yardColor} token ${yardIdx+1}" onclick="moveLudoToken('${yardColor}',${yardIdx})" class="ludo-token yard-ludo-token ${yardColor}"><span></span></button>` : '';
    let mark='';
    if(safe.has(key)) mark='<span class="ludo-star">☆</span>';
    if(r===0&&c===7) mark='<span class="ludo-arrow green-arrow">↓</span>';
    if(r===7&&c===0) mark='<span class="ludo-arrow red-arrow">→</span>';
    if(r===7&&c===14) mark='<span class="ludo-arrow yellow-arrow">←</span>';
    if(r===14&&c===7) mark='<span class="ludo-arrow blue-arrow">↑</span>';
    cellsHtml+=`<div class="ludo-square ${cls}">${tokenHtml||yardDot||mark}</div>`;
  }

    <div class="ludo-board-frame"><div class="ludo-board">${cellsHtml}<div class="ludo-center"><i class="tri-red"></i><i class="tri-green"></i><i class="tri-yellow"></i><i class="tri-blue"></i></div></div></div>

function makeToneWav(freq,duration){const rate=16000,count=Math.floor(rate*duration),buf=new ArrayBuffer(44+count*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};w(0,"RIFF");v.setUint32(4,36+count*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,count*2,true);for(let i=0;i<count;i++){const fade=Math.min(1,i/180,(count-i)/500);v.setInt16(44+i*2,Math.sin(2*Math.PI*freq*i/rate)*fade*9000,true);}return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));}
function initLudoAudio(){[["ludoDiceAudio",560,.12],["ludoStepAudio",420,.075],["ludoWinAudio",880,.28]].forEach(([id,f,d])=>{const el=$(id);if(el&&!el.src)el.src=makeToneWav(f,d);});}
function playLudoSound(kind){const el=$(kind==="dice"?"ludoDiceAudio":kind==="win"?"ludoWinAudio":"ludoStepAudio");if(el){el.currentTime=0;el.play().catch(()=>{});}}
initLudoAudio();

let watchRoomId = null, unsubWatch = null, watchRoomPlayers = {};
window.createWatchRoom = async () => {

};
window.joinWatchRoom = async (codeInp) => {
  const code = (codeInp || $('watchJoinInp')?.value || '').trim().toUpperCase();
  if (!code) return alert('Enter Watch Party Code');
  watchRoomId = code; const ref=doc(db,'watch_rooms',code);
  const initial=await getDoc(ref);
  if(!initial.exists()){watchRoomId=null;return alert('Room not found');}
  const hostUid = initial.data().hostUid || Object.keys(initial.data().players || {})[0];
  if (!hostUid) { watchRoomId=null; return alert('Watch Party host जानकारी उपलब्ध नहीं है।'); }
  await updateDoc(ref,{hostUid,[`players.${currentUser.uid}`]:{uid:currentUser.uid,name:currentUser.displayName||'Player',peerId:myPeerId}});
  if(unsubWatch) unsubWatch();

    const d=snap.data(); watchRoomPlayers=d.players||{};
    $('listArea').innerHTML=`<div class="p-3 space-y-3">

      <video id="syncVideo" src="${d.url}" controls playsinline class="w-full rounded-xl bg-black max-h-64 shadow-lg"></video>
      <div class="flex gap-2"><button onclick="syncMovieAction(true)" class="flex-1 py-2.5 bg-[#25D366] text-white font-bold rounded-xl">▶ Sync Play</button>
      <button onclick="syncMovieAction(false)" class="flex-1 py-2.5 bg-gray-700 text-white font-bold rounded-xl">⏸ Sync Pause</button></div>
    </div>`;
    const mic=$('movieMicBtn');
    if(mic&&roomVoiceStream&&roomVoiceMode==='movie'&&roomVoiceRoomId===code){mic.innerHTML='<i class="fas fa-microphone"></i> Mic ON';mic.classList.remove('bg-gray-700');mic.classList.add('bg-[#25D366]');}
    if(roomVoiceStream&&roomVoiceMode==='movie'&&roomVoiceRoomId===code) startRoomVoice('movie',code,watchRoomPlayers);
    const vid=$('syncVideo'); if(vid){if(Math.abs(vid.currentTime-d.time)>2)vid.currentTime=d.time;d.playing?vid.play().catch(()=>{}):vid.pause();}
  });
};
window.leaveWatchRoom = async () => {
  if(unsubWatch){unsubWatch();unsubWatch=null;}

function renderStatusFeed() {
  if (activeTab !== 'status' || !$('statusFeed')) return;
  const docs = [...statusDocsByUid.values()].flat().sort((a,b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  const groups = new Map();
  docs.forEach(st => { if (!groups.has(st.uid)) groups.set(st.uid, []); groups.get(st.uid).push(st); });
  const entries = [...groups.entries()];
  $('statusFeed').innerHTML = entries.length ? entries.map(([uid,items]) => {
    const latest = items[0], mine = uid === currentUser.uid;
    const avatar = (latest.name || 'U').charAt(0).toUpperCase();
    const preview = latest.mediaType === 'image' ? 'Photo' : latest.mediaType === 'video' ? 'Video' : (latest.text || 'Text update');
    return `<button class="status-user-row" onclick="openStatusViewer('${uid}')">
      <span class="status-ring"><span class="status-avatar">${avatar}</span></span>
      <span class="status-user-meta"><b>${mine ? 'My status' : latest.name || 'User'}</b><small>${mine ? 'Tap to view your updates' : preview}</small></span>
      <span class="status-time">${items.length} update${items.length===1?'':'s'}</span>
    </button>`;
  }).join('') : '<div class="status-empty">No status updates yet. Be the first to share one.</div>';
  window.statusItems = docs;
}
function startStatusFeed() {
  statusFeedUnsubs.forEach(unsub => unsub());
  statusFeedUnsubs = [];
  statusDocsByUid.clear();
  const ownUnsub = onSnapshot(query(collection(db, 'statuses'), where('uid', '==', currentUser.uid)), snap => {
    statusDocsByUid.set(currentUser.uid, snap.docs.map(d => ({id:d.id, ...d.data()})));
    renderStatusFeed();
  }, err => console.warn('Own status query failed:', err));
  statusFeedUnsubs.push(ownUnsub);
  const friendsUnsub = onSnapshot(query(collection(db, 'statuses'), where('visibleTo', 'array-contains', currentUser.uid)), snap => {
    for (const uid of [...statusDocsByUid.keys()]) if (uid !== currentUser.uid) statusDocsByUid.delete(uid);
    const byUid = new Map();
    snap.docs.forEach(d => { const item = {id:d.id, ...d.data()}; if (!byUid.has(item.uid)) byUid.set(item.uid, []); byUid.get(item.uid).push(item); });
    byUid.forEach((items, uid) => statusDocsByUid.set(uid, items));
    renderStatusFeed();
  }, err => console.warn('Friends status query failed:', err));
  statusFeedUnsubs.push(friendsUnsub);
}
function renderCallLogs() {
  if (!$('callLogs')) return;
  const docs = [...callDocsById.values()].sort((a,b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  $('callLogs').innerHTML = docs.map(c => `<div class="p-3.5 flex justify-between items-center"><div><div class="font-bold">${c.callerId===currentUser.uid ? 'Outgoing to '+c.receiverName : 'Incoming from '+c.callerName}</div><div class="text-xs text-gray-500 uppercase">${c.type} • ${c.status}</div></div><i class="fas fa-${c.type==='video'?'video':'phone'} text-[#075E54]"></i></div>`).join('');
}
function startCallLogs() {
  callLogUnsubs.forEach(unsub => unsub());
  callLogUnsubs = [];
  callDocsById.clear();
  [['callerId', currentUser.uid], ['receiverId', currentUser.uid]].forEach(([field,uid]) => {
    const unsub = onSnapshot(query(collection(db, 'calls'), where(field, '==', uid)), snap => {
      snap.docs.forEach(d => callDocsById.set(d.id, d.data()));
      renderCallLogs();
    }, err => console.warn('Call history query failed:', err));
    callLogUnsubs.push(unsub);
  });
}

async function ensureGroupChatRoom(roomId, groupId) {
  if (!currentUser || !groupId) throw new Error('Invalid group chat');
  const groupSnap = await getDoc(doc(db, 'groups', groupId));
  if (!groupSnap.exists()) throw new Error('Group not found');
  const groupData = groupSnap.data();
  const members = Array.isArray(groupData.members) ? [...new Set(groupData.members)] : [];
  if (!members.includes(currentUser.uid)) throw new Error('You are not a member of this group');
  await setDoc(doc(db, 'rooms', roomId), { members, roomType: 'group', groupId, updatedAt: serverTimestamp() }, { merge: true });
}

async function ensurePrivateChatRoom(roomId, otherUid) {
  if (!currentUser || !otherUid || otherUid === currentUser.uid) throw new Error('Invalid private chat participants');
  const members = [currentUser.uid, otherUid].sort();
  await setDoc(doc(db, 'rooms', roomId), { members, roomType: 'private', updatedAt: serverTimestamp() }, { merge: true });
}

window.openChat = async (id, name, isGroup) => {
  if (!isGroup && !areFriends(id)) { alert('पहले FRIENDS टैब से Add Friend भेजें। चैट शुरू करने के लिए सामने वाले की स्वीकृति जरूरी है।'); switchTab('friends'); return; }
  const roomId = isGroup ? 'grp_' + id : [currentUser.uid, id].sort().join('_');
  try {
    if (!isGroup) await ensurePrivateChatRoom(roomId, id);
    else await ensureGroupChatRoom(roomId, id);
  } catch (e) { alert('Chat room तैयार नहीं हो सका: ' + e.message); return; }
  activeChat = { id, name, isGroup, roomId };
  $('blockUserBtn').classList.toggle('hidden', !!isGroup);
  $('chatTitle').textContent = name; $('chatAvatar').textContent = name[0].toUpperCase();
  $('callBtns').classList.toggle('hidden', isGroup); $('chatScreen').classList.remove('hidden');
  renderChatBlockState();
  if (unsubMsgs) unsubMsgs();
  unsubMsgs = onSnapshot(query(collection(db, 'rooms', roomId, 'messages'), orderBy('createdAt', 'asc')), snap => {
    const box = $('msgBox');
    if (!activeChat || (!activeChat.isGroup && isChatBlocked(activeChat.id))) { renderChatBlockState(); return; }
    box.innerHTML = snap.docs.map(d => {
      const m = d.data(), me = m.senderId === currentUser.uid;
      let mediaHtml = '';
      if (m.mediaType === 'image') mediaHtml = `<img src="${m.mediaUrl}" class="max-w-full rounded-lg mb-1 max-h-64 object-cover">`;
      if (m.mediaType === 'video') mediaHtml = `<video src="${m.mediaUrl}" controls playsinline class="max-w-full rounded-lg mb-1 max-h-64 bg-black"></video>`;
      const inviteHtml = m.inviteType && m.inviteCode
        ? `<div class="mt-2 p-3 rounded-xl border ${m.inviteType==='ludo'?'border-[#25D366] bg-[#25D366]/10':'border-purple-400 bg-purple-500/10'}">
            <div class="font-bold mb-1">${m.inviteType==='ludo'?'🎲 Ludo Game Invite':'🎬 Movie Watch Invite'}</div>
            <div class="text-xs opacity-75 mb-2">Room code: <b>${escapeFriendHtml(m.inviteCode)}</b></div>
            <button onclick="joinChatInvite('${m.inviteType}','${escapeFriendHtml(m.inviteCode)}')" class="px-3 py-2 rounded-lg ${m.inviteType==='ludo'?'bg-[#075E54]':'bg-purple-700'} text-white text-xs font-bold">${m.inviteType==='ludo'?'Join Ludo':'Join Movie'}</button>
          </div>`
        : '';
      return `<div class="flex ${me?'justify-end':'justify-start'}"><div class="max-w-[80%] px-3 py-2 rounded-xl shadow-sm text-sm ${me?'bg-[#d9fdd3] dark:bg-[#005c4b]':'bg-white dark:bg-[#202c33]'}">${!me && isGroup ? `<div class="text-[11px] font-bold text-[#075E54] dark:text-[#25D366]">${m.senderName}</div>` : ''}${m.reply ? `<div class="text-[11px] bg-black/10 p-1.5 rounded mb-1 border-l-2 border-[#075E54] truncate">${m.reply}</div>` : ''}${mediaHtml}${m.text ? `<div class="break-words">${m.text}</div>` : ''}${inviteHtml}<div class="flex justify-end items-center gap-2 mt-1 text-[10px] opacity-60"><button onclick="setReply('${(m.text||m.mediaType||'Media').replace(/'/g,'')}')">Reply</button>${me ? `<button onclick="delMsg('${d.id}')" class="text-red-500">Del</button>` : ''}</div></div></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  });
};

window.closeChat = () => { $('chatScreen').classList.add('hidden'); cancelReply(); };
window.setReply = txt => { replyData = txt; $('replyText').textContent = txt; $('replyBar').classList.remove('hidden'); };
window.cancelReply = () => { replyData = null; $('replyBar').classList.add('hidden'); };
window.delMsg = id => deleteDoc(doc(db, 'rooms', activeChat.roomId, 'messages', id));

window.sendLudoInvite = async () => {
  if (!activeChat || !currentUser) return;
  if (!activeChat.isGroup && !areFriends(activeChat.id)) return alert('Invite भेजने के लिए पहले दोस्ती स्वीकार होना जरूरी है।');
  if (!activeChat.isGroup && isChatBlocked(activeChat.id)) return alert('Block होने पर invite नहीं भेज सकते।');
  try {
    const code = Math.random().toString(36).substring(2, 7).toUpperCase();
    const initData = {
      code, hostUid: currentUser.uid, turn: 'red', dice: 0, rolled: false,
      players: { red: { uid: currentUser.uid, name: currentUser.displayName || 'Player 1', peerId: myPeerId } },
      tokens: { red: [-1,-1,-1,-1], green: [-1,-1,-1,-1], yellow: [-1,-1,-1,-1], blue: [-1,-1,-1,-1] }
    };
    await setDoc(doc(db, 'ludo_rooms', code), initData);
    const senderName = currentUser.displayName || 'ChatPro User';
    await addDoc(collection(db, 'rooms', activeChat.roomId, 'messages'), {
      senderId: currentUser.uid, senderName, text: 'Invited you to play Ludo!',
      inviteType: 'ludo', inviteCode: code, createdAt: serverTimestamp()
    });
    if (!activeChat.isGroup) sendPushAlert(activeChat.id, senderName, '🎲 Ludo game invitation', false);
  } catch (e) { alert('Ludo invite नहीं भेजा जा सका: ' + e.message); }
};

window.sendMovieInvite = async () => {
  if (!activeChat || !currentUser) return;
  if (!activeChat.isGroup && isChatBlocked(activeChat.id)) return alert('Block होने पर invite नहीं भेज सकते।');
  const url = (prompt('Movie का direct MP4 video link डालें:') || '').trim();
  if (!url) return;
  try {
    const parsed = new URL(url);
    if (!['http:', 'https:'].includes(parsed.protocol)) return alert('कृपया सही http/https video link डालें।');
    const code = 'MV' + Math.floor(100 + Math.random() * 900);
    await setDoc(doc(db, 'watch_rooms', code), {
      code, hostUid: currentUser.uid, url, playing: false, time: 0, hostPeerId: myPeerId,
      players: { [currentUser.uid]: { uid: currentUser.uid, name: currentUser.displayName || 'Host', peerId: myPeerId } }
    });
    const senderName = currentUser.displayName || 'ChatPro User';
    await addDoc(collection(db, 'rooms', activeChat.roomId, 'messages'), {
      senderId: currentUser.uid, senderName, text: 'Invited you to a Movie Watch Party!',
      inviteType: 'movie', inviteCode: code, createdAt: serverTimestamp()
    });
    if (!activeChat.isGroup) sendPushAlert(activeChat.id, senderName, '🎬 Movie Watch Party invitation', false);
  } catch (e) { alert('Movie invite नहीं भेजा जा सका: ' + e.message); }
};

window.joinChatInvite = async (type, code) => {
  if (!/^[A-Z0-9]{3,8}$/.test(code || '')) return alert('Invite code सही नहीं है।');
  closeChat();
  if (type === 'ludo') {
    switchTab('ludo');
    await joinLudoRoom(code);
  } else if (type === 'movie') {
    switchTab('movie');
    await joinWatchRoom(code);
  }
};

window.sendMsg = async () => {
  const txt = $('msgInput').value.trim();
  if (!txt || !activeChat) return;
  if (!activeChat.isGroup && !areFriends(activeChat.id)) return alert('मैसेज के लिए पहले दोस्ती स्वीकार होना जरूरी है।');
  if (!activeChat.isGroup && isChatBlocked(activeChat.id)) return alert('Block होने पर message नहीं भेज सकते।');
  $('msgInput').value = ''; const rep = replyData; cancelReply();
  const senderName = currentUser.displayName || 'ChatPro User';
  if (!activeChat.isGroup) await ensurePrivateChatRoom(activeChat.roomId, activeChat.id);
  await addDoc(collection(db, 'rooms', activeChat.roomId, 'messages'), { senderId: currentUser.uid, senderName, text: txt, reply: rep, createdAt: serverTimestamp() });
  if (!activeChat.isGroup) sendPushAlert(activeChat.id, senderName, txt, false);
};

window.sendMedia = e => {
  const file = e.target.files[0];
  if (!file || !activeChat) return;
  if (!activeChat.isGroup && !areFriends(activeChat.id)) { alert('Media भेजने के लिए पहले दोस्ती स्वीकार होना जरूरी है।'); e.target.value=''; return; }
  if (!activeChat.isGroup && isChatBlocked(activeChat.id)) { alert('Block होने पर media नहीं भेज सकते।'); e.target.value=''; return; }
  if (file.size > 900 * 1024) { alert("Select a photo or short video under 1 MB!"); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const isVid = file.type.startsWith('video'), senderName = currentUser.displayName || 'ChatPro User';
    if (!activeChat.isGroup) await ensurePrivateChatRoom(activeChat.roomId, activeChat.id);
    await addDoc(collection(db, 'rooms', activeChat.roomId, 'messages'), { senderId: currentUser.uid, senderName, mediaUrl: reader.result, mediaType: isVid ? 'video' : 'image', text: '', createdAt: serverTimestamp() });
    if (!activeChat.isGroup) sendPushAlert(activeChat.id, senderName, isVid ? '📹 Sent a video' : '📷 Sent a photo', false);
  };
  reader.readAsDataURL(file); e.target.value = '';
};

function playRingtone() {
  stopRingtone();
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => { const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(520, audioCtx.currentTime); osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.25); gain.gain.setValueAtTime(0.25, audioCtx.currentTime); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5); };
    beep(); ringInterval = setInterval(beep, 1200);
  } catch(e){}
}
function stopRingtone() { if (ringInterval) clearInterval(ringInterval); if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; } }

window.startCall = async type => {
  if (!activeChat || activeChat.isGroup) return;
  if (!areFriends(activeChat.id)) return alert('कॉल के लिए पहले Friend Request स्वीकार होना जरूरी है।');
  if (isChatBlocked(activeChat.id)) return alert('Block होने पर कॉल नहीं कर सकते।');
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' });
    $('localVideo').srcObject = localStream; $('localVideo').classList.toggle('hidden', type !== 'video'); $('audioOnlyOverlay').classList.toggle('hidden', type === 'video');
    $('callPeerName').textContent = activeChat.name; $('callStatusTxt').textContent = 'Ringing...'; $('activeCallScreen').classList.remove('hidden');
    const callerName = currentUser.displayName || 'ChatPro User';
    const callRef = await addDoc(collection(db, 'calls'), { callerId: currentUser.uid, callerName, receiverId: activeChat.id, receiverName: activeChat.name, callerPeerId: myPeerId, type, status: 'ringing', createdAt: serverTimestamp() });
    currentCallDocId = callRef.id;
    sendPushAlert(activeChat.id, `Incoming ${type === 'video' ? 'Video' : 'Voice'} Call`, `${callerName} is calling you on ChatPro... Tap to answer!`, true);
    const unsub = onSnapshot(doc(db, 'calls', callRef.id), snap => {
      const data = snap.data();
      if (!data) return;
      if (data.status === 'accepted' && data.receiverPeerId && !currentCallObj) { $('callStatusTxt').textContent = 'Connected'; currentCallObj = peer.call(data.receiverPeerId, localStream); currentCallObj.on('stream', rem => { $('remoteVideo').srcObject = rem; $('callStatusTxt').textContent='Connected'; startCallTimer(); }); }
      else if (data.status === 'rejected' || data.status === 'ended') { unsub(); cleanupCall(); }
    });
  } catch (err) { alert('Allow Camera & Microphone permissions to call!'); }
};

function listenIncomingCalls() {
  onSnapshot(query(collection(db, 'calls'), where('receiverId', '==', currentUser.uid), where('status', '==', 'ringing')), snap => {
    snap.docChanges().forEach(chg => {
      if (chg.type === 'added') { const c = chg.doc.data(); if (isChatBlocked(c.callerId) || !areFriends(c.callerId)) { updateDoc(doc(db,'calls',chg.doc.id),{status:'rejected'}).catch(()=>{}); return; } currentCallDocId = chg.doc.id; window.pendingCall = c; $('inCallerName').textContent = c.callerName; $('inCallType').textContent = `Incoming ${c.type} Call...`; $('incomingModal').classList.remove('hidden'); playRingtone(); }
    });
  });
}

window.acceptIncomingCall = async () => {
  stopRingtone(); $('incomingModal').classList.add('hidden'); const c = window.pendingCall; if (!c) return;
  if (isChatBlocked(c.callerId)) { await updateDoc(doc(db,'calls',currentCallDocId),{status:'rejected'}).catch(()=>{}); return alert('यह यूज़र ब्लॉक है।'); }
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: c.type === 'video' });
    $('localVideo').srcObject = localStream; $('localVideo').classList.toggle('hidden', c.type !== 'video'); $('audioOnlyOverlay').classList.toggle('hidden', c.type === 'video');
    $('callPeerName').textContent = c.callerName; $('callStatusTxt').textContent = 'Connecting...'; $('activeCallScreen').classList.remove('hidden');
    await updateDoc(doc(db, 'calls', currentCallDocId), { status: 'accepted', receiverPeerId: myPeerId });
    onSnapshot(doc(db, 'calls', currentCallDocId), snap => { if (snap.data()?.status === 'ended') cleanupCall(); });
  } catch (e) { alert('Camera/Mic permission needed'); rejectIncomingCall(); }
};

window.rejectIncomingCall = async () => { stopRingtone(); $('incomingModal').classList.add('hidden'); if (currentCallDocId) await updateDoc(doc(db, 'calls', currentCallDocId), { status: 'rejected' }).catch(()=>{}); };
window.endActiveCall = async () => { if (currentCallDocId) await updateDoc(doc(db, 'calls', currentCallDocId), { status: 'ended' }).catch(()=>{}); cleanupCall(); };
function startCallTimer() {
  if(callTimerInterval) clearInterval(callTimerInterval);
  callStartedAt=Date.now();
  const tick=()=>{const n=Math.floor((Date.now()-callStartedAt)/1000);const el=$('callTimer');if(el)el.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
  tick(); callTimerInterval=setInterval(tick,1000);
}
function stopCallTimer(){if(callTimerInterval)clearInterval(callTimerInterval);callTimerInterval=null;callStartedAt=0;const el=$('callTimer');if(el)el.textContent='00:00';}
function cleanupCall() { stopRingtone(); stopCallTimer(); $('activeCallScreen').classList.add('hidden'); $('incomingModal').classList.add('hidden'); if (currentCallObj) { currentCallObj.close(); currentCallObj = null; } if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; } currentCallDocId = null; }
window.toggleMute = () => { if (!localStream) return; isMuted = !isMuted; localStream.getAudioTracks().forEach(t => t.enabled = !isMuted); $('muteBtn').innerHTML = isMuted ? '<i class="fas fa-microphone-slash text-red-400"></i>' : '<i class="fas fa-microphone"></i>'; };
window.openGroupModal = () => { $('grpMembers').innerHTML = allUsers.map(u => `<label class="flex items-center gap-2"><input type="checkbox" value="${u.uid}" class="grpChk"> ${u.name}</label>`).join(''); $('groupModal').classList.remove('hidden'); };
window.createGroup = async () => { const name = $('grpName').value.trim(), members = [currentUser.uid, ...Array.from(document.querySelectorAll('.grpChk:checked')).map(c => c.value)]; if (!name || members.length < 2) return alert('Enter group name & pick members'); await addDoc(collection(db, 'groups'), { name, members, createdAt: serverTimestamp() }); $('groupModal').classList.add('hidden'); };
</script>
