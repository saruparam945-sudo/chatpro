<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ChatPro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075E54">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "de3c0523-8122-471c-bd11-a7c0dd6e3efe",
      serviceWorkerParam: { scope: "/chatpro/" },
      serviceWorkerPath: "chatpro/OneSignalSDKWorker.js"
    });
    if (window.currentUidForOS) {
      OneSignal.login(window.currentUidForOS);
    }
  });
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#e5ddd5}
.dark body{background:#0b141a;color:#e9edef}
.chat-bg{background-color:#efeae2;background-image:radial-gradient(#d4cdc4 1px,transparent 1px);background-size:20px 20px}
.dark .chat-bg{background-color:#0b141a;background-image:radial-gradient(#1f2c34 1px,transparent 1px)}
@keyframes pulseRing{0%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(37,211,102,0.7)}70%{transform:scale(1);box-shadow:0 0 0 20px rgba(37,211,102,0)}100%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.ring-anim{animation:pulseRing 1.5s infinite}
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- AUTH SCREEN -->
<div id="authScreen" class="fixed inset-0 z-50 bg-[#075E54] flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl">
    <div class="flex flex-col items-center mb-5">
      <div class="w-16 h-16 rounded-2xl bg-[#25D366] flex items-center justify-center text-white text-3xl shadow-lg mb-2"><i class="fas fa-phone"></i></div>
      <h1 class="text-2xl font-bold text-[#075E54]">ChatPro</h1>
      <p class="text-xs text-gray-500">Chat • Calls • Ludo • Watch Party</p>
    </div>
    <div id="nameBox" class="hidden mb-3">
      <input id="authName" type="text" placeholder="Your Full Name" class="w-full px-4 py-3 border rounded-xl outline-none focus:border-[#075E54]">
    </div>
    <input id="authEmail" type="email" placeholder="Email Address" class="w-full px-4 py-3 border rounded-xl mb-3 outline-none focus:border-[#075E54]">
    <input id="authPass" type="password" placeholder="Password (min 6 chars)" class="w-full px-4 py-3 border rounded-xl mb-4 outline-none focus:border-[#075E54]">
    <button id="authBtn" onclick="handleAuth()" class="w-full py-3 bg-[#075E54] text-white font-bold rounded-xl shadow active:scale-95">Login</button>
    <p id="authErr" class="text-red-500 text-xs text-center mt-2"></p>
    <p class="text-center text-sm text-gray-600 mt-4">
      <span id="authToggleTxt">Don't have an account?</span>
      <button onclick="toggleAuthMode()" id="authToggleBtn" class="text-[#075E54] font-bold ml-1">Sign Up</button>
    </p>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden flex-1 flex flex-col h-full max-w-2xl w-full mx-auto bg-white dark:bg-[#111b21] shadow-xl">
  <div class="bg-[#075E54] dark:bg-[#202c33] text-white px-4 pt-3 pb-2 shadow">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span class="font-bold text-xl tracking-wide">ChatPro</span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#25D366]" title="Online"></span>
      </div>
      <div class="flex items-center gap-4 text-lg">
        <button onclick="enablePush()" title="Enable Ring & Notifications"><i class="fas fa-bell"></i></button>
        <button onclick="openGroupModal()" title="New Group"><i class="fas fa-users"></i></button>
        <button onclick="toggleDark()" title="Dark Mode"><i class="fas fa-moon"></i></button>
        <button onclick="logoutUser()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
    <div class="flex text-xs font-bold tracking-wide overflow-x-auto">
      <button onclick="switchTab('chats')" id="tab-chats" class="flex-1 pb-2 border-b-2 border-white">CHATS</button>
      <button onclick="switchTab('ludo')" id="tab-ludo" class="flex-1 pb-2 border-b-2 border-transparent opacity-75">🎮 LUDO</button>
      <button onclick="switchTab('movie')" id="tab-movie" class="flex-1 pb-2 border-b-2 border-transparent opacity-75">🎬 MOVIE</button>
      <button onclick="switchTab('status')" id="tab-status" class="flex-1 pb-2 border-b-2 border-transparent opacity-75">STATUS</button>
      <button onclick="switchTab('calls')" id="tab-calls" class="flex-1 pb-2 border-b-2 border-transparent opacity-75">CALLS</button>
    </div>
  </div>

  <div id="searchWrap" class="p-2 bg-gray-50 dark:bg-[#111b21] border-b dark:border-gray-800">
    <input id="searchBox" oninput="renderLists()" type="text" placeholder="Search contacts or groups..." class="w-full px-4 py-2 rounded-full bg-white dark:bg-[#202c33] text-sm outline-none border dark:border-gray-700">
  </div>

  <div id="listArea" class="flex-1 overflow-y-auto divide-y dark:divide-gray-800"></div>
</div>

<!-- CHAT ROOM SCREEN -->
<div id="chatScreen" class="hidden fixed inset-0 z-30 flex flex-col max-w-2xl w-full mx-auto bg-[#efeae2] dark:bg-[#0b141a]">
  <div class="bg-[#075E54] dark:bg-[#202c33] text-white px-3 py-2.5 flex items-center justify-between shadow">
    <div class="flex items-center gap-2.5 overflow-hidden">
      <button onclick="closeChat()" class="p-1 text-lg"><i class="fas fa-arrow-left"></i></button>
      <div id="chatAvatar" class="w-9 h-9 rounded-full bg-[#25D366] flex items-center justify-center font-bold text-white shrink-0">U</div>
      <div class="truncate">
        <div id="chatTitle" class="font-bold text-base truncate">User</div>
        <div id="chatSub" class="text-[11px] text-green-200 truncate">online</div>
      </div>
    </div>
    <div id="callBtns" class="flex items-center gap-4 text-lg pr-1">
      <button onclick="startCall('video')" class="p-1.5 hover:bg-white/10 rounded-full"><i class="fas fa-video"></i></button>
      <button onclick="startCall('audio')" class="p-1.5 hover:bg-white/10 rounded-full"><i class="fas fa-phone"></i></button>
    </div>
  </div>
  <div id="replyBar" class="hidden bg-white dark:bg-[#202c33] px-4 py-2 border-l-4 border-[#25D366] flex justify-between items-center text-xs">
    <div class="truncate"><span class="font-bold text-[#075E54] dark:text-[#25D366]">Replying:</span> <span id="replyText"></span></div>
    <button onclick="cancelReply()" class="text-gray-500 text-base ml-2">&times;</button>
  </div>
  <div id="msgBox" class="flex-1 overflow-y-auto p-3 space-y-2 chat-bg"></div>
  <div class="p-2 bg-[#f0f2f5] dark:bg-[#202c33] flex items-center gap-2">
    <label class="w-10 h-10 rounded-full bg-white dark:bg-[#2a3942] flex items-center justify-center text-gray-600 dark:text-gray-300 cursor-pointer shadow-sm shrink-0">
      <i class="fas fa-photo-video text-lg text-[#075E54] dark:text-[#25D366]"></i>
      <input id="mediaInput" type="file" accept="image/*,video/*" class="hidden" onchange="sendMedia(event)">
    </label>
    <input id="msgInput" onkeypress="if(event.key==='Enter')sendMsg()" type="text" placeholder="Type a message..." class="flex-1 px-4 py-2.5 rounded-full bg-white dark:bg-[#2a3942] text-sm outline-none shadow-sm">
    <button onclick="sendMsg()" class="w-11 h-11 rounded-full bg-[#075E54] text-white flex items-center justify-center shadow active:scale-95 shrink-0">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>
</div>

<!-- INCOMING RINGING CALL MODAL -->
<div id="incomingModal" class="hidden fixed inset-0 z-50 bg-[#0b141a]/95 text-white flex flex-col items-center justify-between py-16 px-6">
  <div class="text-center">
    <p id="inCallType" class="text-sm uppercase tracking-widest text-[#25D366] mb-2">Incoming Call...</p>
    <div class="w-24 h-24 rounded-full bg-[#075E54] mx-auto flex items-center justify-center text-4xl font-bold mb-4 ring-anim"><i class="fas fa-user"></i></div>
    <h2 id="inCallerName" class="text-2xl font-bold">Caller</h2>
    <p class="text-gray-400 text-sm mt-1">ChatPro Encrypted Call</p>
  </div>
  <div class="flex gap-12">
    <button onclick="rejectIncomingCall()" class="w-16 h-16 rounded-full bg-red-600 flex items-center justify-center text-2xl shadow-lg active:scale-90"><i class="fas fa-phone-slash"></i></button>
    <button onclick="acceptIncomingCall()" class="w-16 h-16 rounded-full bg-[#25D366] flex items-center justify-center text-2xl shadow-lg active:scale-90 ring-anim"><i class="fas fa-phone"></i></button>
  </div>
</div>

<!-- ACTIVE CALL SCREEN -->
<div id="activeCallScreen" class="hidden fixed inset-0 z-50 bg-black text-white flex flex-col">
  <div class="relative flex-1 flex items-center justify-center overflow-hidden">
    <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
    <div id="audioOnlyOverlay" class="hidden absolute inset-0 bg-[#075E54] flex flex-col items-center justify-center">
      <div class="w-24 h-24 rounded-full bg-white/20 flex items-center justify-center text-4xl mb-3"><i class="fas fa-user"></i></div>
      <h3 id="callPeerName" class="text-2xl font-bold">Connected</h3>
      <p id="callStatusTxt" class="text-green-200 mt-1">Ringing...</p>
    </div>
    <video id="localVideo" autoplay muted playsinline class="w-28 h-40 object-cover rounded-xl border-2 border-white absolute top-4 right-4 bg-gray-900 shadow-lg"></video>
  </div>
  <div class="bg-gray-900/90 py-5 flex justify-center gap-8">
    <button id="muteBtn" onclick="toggleMute()" class="w-14 h-14 rounded-full bg-gray-700 flex items-center justify-center text-xl"><i class="fas fa-microphone"></i></button>
    <button onclick="endActiveCall()" class="w-14 h-14 rounded-full bg-red-600 flex items-center justify-center text-xl"><i class="fas fa-phone-slash"></i></button>
  </div>
</div>

<!-- GROUP MODAL -->
<div id="groupModal" class="hidden fixed inset-0 z-40 bg-black/60 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-[#202c33] w-full max-w-sm rounded-2xl p-5">
    <h3 class="font-bold text-lg mb-3">Create New Group</h3>
    <input id="grpName" type="text" placeholder="Group Name" class="w-full px-3 py-2 border dark:border-gray-700 dark:bg-[#2a3942] rounded-xl mb-3 outline-none">
    <div id="grpMembers" class="max-h-40 overflow-y-auto space-y-2 mb-4 text-sm"></div>
    <div class="flex justify-end gap-2">
      <button onclick="$('groupModal').classList.add('hidden')" class="px-4 py-2 text-gray-500">Cancel</button>
      <button onclick="createGroup()" class="px-4 py-2 bg-[#075E54] text-white rounded-xl font-bold">Create</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, deleteDoc, query, orderBy, onSnapshot, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBp1RrU7qLYUzQqgnO-s7CyUzLmFNgyUVY",
  authDomain: "chatpro-ad693.firebaseapp.com",
  projectId: "chatpro-ad693",
  storageBucket: "chatpro-ad693.firebasestorage.app",
  messagingSenderId: "615128115099",
  appId: "1:615128115099:web:a32d012cc8018eb77ba33e",
  measurementId: "G-V31RJGQMYK"
};
const OS_APP_ID = "de3c0523-8122-471c-bd11-a7c0dd6e3efe";
const OS_API_KEY = "os_v2_app_" + "3y6aki4bejdrzpiru7an23r67yxkn2ajmmluv75wn7yldmiy2okq324aamxf3jawfduydmdzylithoukkth6gfzoewemumo7fosnc6a";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.$ = id => document.getElementById(id);
let isSignup = false, currentUser = null, allUsers = [], allGroups = [], activeTab = 'chats';
let activeChat = null, unsubMsgs = null, replyData = null;
let peer = null, myPeerId = null, localStream = null, currentCallObj = null, currentCallDocId = null, ringInterval = null, audioCtx = null, isMuted = false;
let ludoRoom = null, unsubLudo = null, movieRoom = null, unsubMovie = null, voiceStream = null, voiceMuted = false;

async function sendPushAlert(targetUid, title, body, isCall = false) {
  try {
    await fetch("https://api.onesignal.com/notifications", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Key " + OS_API_KEY },
      body: JSON.stringify({
        app_id: OS_APP_ID,
        include_aliases: { external_id: [targetUid] },
        target_channel: "push",
        headings: { en: title },
        contents: { en: body },
        url: "https://saruparam945-sudo.github.io/chatpro/",
        priority: isCall ? 10 : 8
      })
    });
  } catch (e) {}
}

window.enablePush = () => {
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.Notifications.requestPermission();
    if (currentUser) await OneSignal.login(currentUser.uid);
    alert("Background Ring & Message Alerts Activated!");
  });
};

window.toggleAuthMode = () => {
  isSignup = !isSignup;
  $('nameBox').classList.toggle('hidden', !isSignup);
  $('authBtn').textContent = isSignup ? 'Create Account' : 'Login';
  $('authToggleTxt').textContent = isSignup ? 'Already have an account?' : "Don't have an account?";
  $('authToggleBtn').textContent = isSignup ? 'Login' : 'Sign Up';
};

window.handleAuth = async () => {
  const email = $('authEmail').value.trim(), pass = $('authPass').value.trim(), name = $('authName').value.trim();
  $('authErr').textContent = '';
  try {
    if (isSignup) {
      if (!name) return $('authErr').textContent = 'Enter your name';
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, 'users', cred.user.uid), { uid: cred.user.uid, name, email, online: true });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) { $('authErr').textContent = e.message; }
};

window.logoutUser = () => signOut(auth);
window.toggleDark = () => document.documentElement.classList.toggle('dark');

onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user; window.currentUidForOS = user.uid;
    $('authScreen').classList.add('hidden'); $('mainApp').classList.remove('hidden');
    await setDoc(doc(db, 'users', user.uid), { uid: user.uid, name: user.displayName || user.email.split('@')[0], email: user.email, online: true }, { merge: true });
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) { await OneSignal.login(user.uid); await OneSignal.Notifications.requestPermission(); });
    initPeer(); listenUsersAndGroups(); listenIncomingCalls();
  } else {
    $('authScreen').classList.remove('hidden'); $('mainApp').classList.add('hidden');
  }
});

function initPeer() {
  peer = new Peer('cp_' + currentUser.uid.slice(0, 12) + '_' + Math.floor(Math.random()*900+100));
  peer.on('open', id => { myPeerId = id; updateDoc(doc(db, 'users', currentUser.uid), { peerId: id }).catch(()=>{}); });
  peer.on('call', call => {
    currentCallObj = call;
    if (localStream) { call.answer(localStream); call.on('stream', rem => { $('remoteVideo').srcObject = rem; $('callStatusTxt').textContent = 'Connected'; }); }
    else if (voiceStream) { call.answer(voiceStream); call.on('stream', rem => { const a = new Audio(); a.srcObject = rem; a.play(); }); }
  });
}

function listenUsersAndGroups() {
  onSnapshot(collection(db, 'users'), snap => { allUsers = snap.docs.map(d => d.data()).filter(u => u.uid !== currentUser.uid); if(activeTab==='chats') renderLists(); });
  onSnapshot(collection(db, 'groups'), snap => { allGroups = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(g => g.members?.includes(currentUser.uid)); if(activeTab==='chats') renderLists(); });
}

window.switchTab = t => {
  activeTab = t;
  ['chats','ludo','movie','status','calls'].forEach(x => {
    $('tab-'+x).classList.toggle('border-white', x===t);
    $('tab-'+x).classList.toggle('border-transparent', x!==t);
    $('tab-'+x).classList.toggle('opacity-75', x!==t);
  });
  $('searchWrap').classList.toggle('hidden', t !== 'chats');
  renderLists();
};

window.renderLists = () => {
  const box = $('listArea');
  if (activeTab === 'chats') {
    const q = $('searchBox').value.toLowerCase();
    let html = '';
    allGroups.filter(g => g.name.toLowerCase().includes(q)).forEach(g => {
      html += `<div onclick="openChat('${g.id}','${g.name}',true)" class="flex items-center gap-3 p-3.5 hover:bg-gray-100 dark:hover:bg-[#202c33] cursor-pointer"><div class="w-12 h-12 rounded-full bg-[#075E54] text-white flex items-center justify-center font-bold"><i class="fas fa-users"></i></div><div class="flex-1"><div class="font-bold">${g.name}</div><div class="text-xs text-gray-500">Group • ${g.members.length} members</div></div></div>`;
    });
    allUsers.filter(u => u.name.toLowerCase().includes(q)).forEach(u => {
      html += `<div onclick="openChat('${u.uid}','${u.name}',false)" class="flex items-center gap-3 p-3.5 hover:bg-gray-100 dark:hover:bg-[#202c33] cursor-pointer"><div class="w-12 h-12 rounded-full bg-[#25D366] text-white flex items-center justify-center font-bold text-lg">${u.name[0].toUpperCase()}</div><div class="flex-1"><div class="font-bold">${u.name}</div><div class="text-xs text-gray-500">${u.email}</div></div></div>`;
    });
    box.innerHTML = html || '<p class="text-center text-gray-400 p-8 text-sm">No contacts found. Ask friends to sign up on ChatPro!</p>';
  } else if (activeTab === 'ludo') {
    renderLudoUI(box);
  } else if (activeTab === 'movie') {
    renderMovieUI(box);
  } else if (activeTab === 'status') {
    box.innerHTML = `<div class="p-4"><button onclick="postStatus()" class="w-full py-3 bg-[#25D366] text-white rounded-xl font-bold mb-4 shadow">+ Post Text Status</button><div id="statusFeed" class="space-y-3"></div></div>`;
    onSnapshot(query(collection(db, 'statuses'), orderBy('createdAt', 'desc')), snap => {
      if ($('statusFeed')) $('statusFeed').innerHTML = snap.docs.map(d => { const s = d.data(); return `<div class="p-4 rounded-xl bg-[#075E54] text-white shadow"><div class="text-xs opacity-75 mb-1">${s.name}</div><div class="text-base font-medium">${s.text}</div></div>`; }).join('');
    });
  } else {
    box.innerHTML = `<div id="callLogs" class="divide-y dark:divide-gray-800"></div>`;
    onSnapshot(query(collection(db, 'calls'), orderBy('createdAt', 'desc')), snap => {
      if ($('callLogs')) $('callLogs').innerHTML = snap.docs.map(d => d.data()).filter(c => c.callerId===currentUser.uid || c.receiverId===currentUser.uid).map(c => `<div class="p-3.5 flex justify-between items-center"><div><div class="font-bold">${c.callerId===currentUser.uid ? 'Outgoing to '+c.receiverName : 'Incoming from '+c.callerName}</div><div class="text-xs text-gray-500 uppercase">${c.type} • ${c.status}</div></div><i class="fas fa-${c.type==='video'?'video':'phone'} text-[#075E54]"></i></div>`).join('');
    });
  }
};

// 🎮 LUDO + LIVE VOICE MIC
function renderLudoUI(box) {
  if (!ludoRoom) {
    box.innerHTML = `<div class="p-5 space-y-4">
      <div class="bg-gradient-to-r from-[#075E54] to-[#128C7E] text-white p-5 rounded-2xl shadow-lg">
        <h2 class="text-xl font-bold mb-1">🎮 ChatPro Online Ludo + Mic</h2>
        <p class="text-xs opacity-90">Play 2-4 players live with real-time voice chat!</p>
      </div>
      <button onclick="createLudoRoom()" class="w-full py-3.5 bg-[#25D366] text-white font-bold rounded-xl shadow active:scale-95">Create New Ludo Room</button>
      <div class="flex gap-2">
        <input id="ludoJoinCode" type="text" placeholder="Enter 4-digit Room Code" class="flex-1 px-4 py-3 border rounded-xl outline-none uppercase dark:bg-[#202c33]">
        <button onclick="joinLudoRoom()" class="px-6 py-3 bg-[#075E54] text-white font-bold rounded-xl">Join</button>
      </div>
    </div>`;
  } else {
    box.innerHTML = `<div class="p-3 space-y-3">
      <div class="flex items-center justify-between bg-[#075E54] text-white px-4 py-2.5 rounded-xl">
        <div><span class="text-xs opacity-75">ROOM CODE:</span> <span class="font-bold text-lg tracking-widest">${ludoRoom}</span></div>
        <div class="flex gap-2">
          <button onclick="toggleRoomVoice()" id="ludoMicBtn" class="px-3 py-1.5 bg-[#25D366] rounded-lg text-xs font-bold"><i class="fas fa-microphone"></i> Mic</button>
          <button onclick="leaveLudo()" class="px-3 py-1.5 bg-red-600 rounded-lg text-xs font-bold">Exit</button>
        </div>
      </div>
      <div id="ludoPlayers" class="grid grid-cols-2 gap-2 text-xs"></div>
      <div class="aspect-square max-w-sm mx-auto bg-white border-4 border-[#075E54] rounded-xl grid grid-cols-3 grid-rows-3 overflow-hidden shadow-lg">
        <div class="bg-red-500 p-2 grid grid-cols-2 gap-1.5 items-center justify-items-center"><span class="w-5 h-5 rounded-full bg-white shadow"></span><span class="w-5 h-5 rounded-full bg-white shadow"></span><span class="w-5 h-5 rounded-full bg-white shadow"></span><span class="w-5 h-5 rounded-full bg-white shadow"></span></div>
        <div class="bg-gray-100 border-x grid grid-cols-3 text-[10px] items-center justify-items-center font-bold text-gray-500"><span></span><span class="bg-green-200 w-full h-full flex items-center justify-center">↓</span><span></span><span></span><span class="bg-green-200 w-full h-full flex items-center justify-center">↓</span><span></span><span></span><span class="bg-green-200 w-full h-full flex items-center justify-center">↓</span><span></span></div>

window.createLudoRoom = async () => {
  const code = Math.floor(1000 + Math.random() * 9000).toString();
  const colors = ['Red', 'Green', 'Yellow', 'Blue'];
  await setDoc(doc(db, 'ludoRooms', code), {
    code, dice: 6, turnIdx: 0,
    players: [{ uid: currentUser.uid, name: currentUser.displayName || 'Player 1', color: colors[0], score: 0, peerId: myPeerId }]
  });
  listenLudoRoom(code);
};

window.joinLudoRoom = async () => {
  const code = $('ludoJoinCode').value.trim();
  if (!code) return alert('Enter 4-digit code');
  const ref = doc(db, 'ludoRooms', code);
  const snap = await getDoc(ref);
  if (!snap.exists()) return alert('Room not found!');
  const data = snap.data();
  const colors = ['Red', 'Green', 'Yellow', 'Blue'];
  if (!data.players.some(p => p.uid === currentUser.uid)) {
    if (data.players.length >= 4) return alert('Room is full (Max 4 players)');
    data.players.push({ uid: currentUser.uid, name: currentUser.displayName || 'Player', color: colors[data.players.length], score: 0, peerId: myPeerId });
    await updateDoc(ref, { players: data.players });
  }
  listenLudoRoom(code);
};

function listenLudoRoom(code) {
  ludoRoom = code;
  renderLists();
  if (unsubLudo) unsubLudo();
  unsubLudo = onSnapshot(doc(db, 'ludoRooms', code), snap => {
    const d = snap.data();
    if (!d || !$('ludoPlayers')) return;
    $('diceVal').textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][d.dice - 1] || '🎲';
    const curP = d.players[d.turnIdx % d.players.length];
    $('ludoTurnTxt').textContent = `${curP.name} (${curP.color})`;
    $('ludoPlayers').innerHTML = d.players.map(p => `<div class="p-2 rounded-lg bg-gray-100 dark:bg-[#202c33] flex justify-between font-bold"><span>${p.color}: ${p.name}</span><span>★ ${p.score}</span></div>`).join('');
  });
}

window.rollLudoDice = async () => {
  if (!ludoRoom) return;
  const ref = doc(db, 'ludoRooms', ludoRoom);
  const snap = await getDoc(ref);
  const d = snap.data();
  const curP = d.players[d.turnIdx % d.players.length];
  if (curP.uid !== currentUser.uid) return alert(`Wait for ${curP.name}'s turn!`);
  const roll = Math.floor(1 + Math.random() * 6);
  d.players[d.turnIdx % d.players.length].score += roll;
  const nextTurn = roll === 6 ? d.turnIdx : (d.turnIdx + 1) % d.players.length;
  await updateDoc(ref, { dice: roll, turnIdx: nextTurn, players: d.players });
};

window.leaveLudo = () => { if (unsubLudo) unsubLudo(); ludoRoom = null; renderLists(); };

// 🎬 LIVE MOVIE WATCH PARTY

        <p class="text-xs opacity-90">Watch videos together in real-time sync with live mic!</p>

      <button onclick="createMovieRoom()" class="w-full py-3.5 bg-[#25D366] text-white font-bold rounded-xl shadow active:scale-95">Start New Watch Party</button>

          <button onclick="leaveMovie()" class="px-3 py-1.5 bg-red-600 rounded-lg text-xs font-bold">Exit</button>

window.createMovieRoom = async () => {
  const code = Math.floor(1000 + Math.random() * 9000).toString();
  await setDoc(doc(db, 'movieRooms', code), {
    code, url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', playing: false, time: 0
  });
  listenMovieRoom(code);
};

window.joinMovieRoom = async () => {
  const code = $('movieJoinCode').value.trim();
  if (!code) return alert('Enter 4-digit party code');
  const snap = await getDoc(doc(db, 'movieRooms', code));
  if (!snap.exists()) return alert('Party room not found!');
  listenMovieRoom(code);
};

function listenMovieRoom(code) {
  movieRoom = code;
  renderLists();
  if (unsubMovie) unsubMovie();
  unsubMovie = onSnapshot(doc(db, 'movieRooms', code), snap => {
    const d = snap.data(), vid = $('partyVideo');
    if (!d || !vid) return;
    if (d.url && vid.src !== d.url) vid.src = d.url;
    if (Math.abs(vid.currentTime - d.time) > 2) vid.currentTime = d.time;
    if (d.playing && vid.paused) vid.play().catch(()=>{});
    if (!d.playing && !vid.paused) vid.pause();
  });
}

window.setMovieUrl = async () => {
  const url = $('movieUrlInput').value.trim();
  if (url && movieRoom) await updateDoc(doc(db, 'movieRooms', movieRoom), { url, time: 0, playing: true });
};

window.syncMovieState = async playing => {
  const vid = $('partyVideo');
  if (vid && movieRoom) await updateDoc(doc(db, 'movieRooms', movieRoom), { playing, time: vid.currentTime }).catch(()=>{});
};

window.leaveMovie = () => { if (unsubMovie) unsubMovie(); movieRoom = null; renderLists(); };

window.toggleRoomVoice = async () => {
  try {
    if (!voiceStream) {
      voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      alert("Live Room Mic ON! Friends in the room can now hear you.");
    } else {
      voiceMuted = !voiceMuted;
      voiceStream.getAudioTracks().forEach(t => t.enabled = !voiceMuted);
      alert(voiceMuted ? "Mic Muted" : "Mic Unmuted");
    }
  } catch (e) { alert("Allow Microphone permission to talk!"); }
};

// STATUS & CHAT FUNCTIONS
window.postStatus = async () => {
  const txt = prompt("Type your status update:");
  if (txt) await addDoc(collection(db, 'statuses'), { uid: currentUser.uid, name: currentUser.displayName || 'User', text: txt, createdAt: serverTimestamp() });
};

window.openChat = (id, name, isGroup) => {
  const roomId = isGroup ? 'grp_' + id : [currentUser.uid, id].sort().join('_');
  activeChat = { id, name, isGroup, roomId };
  $('chatTitle').textContent = name; $('chatAvatar').textContent = name[0].toUpperCase();
  $('callBtns').classList.toggle('hidden', isGroup); $('chatScreen').classList.remove('hidden');
  if (unsubMsgs) unsubMsgs();
  unsubMsgs = onSnapshot(query(collection(db, 'rooms', roomId, 'messages'), orderBy('createdAt', 'asc')), snap => {
    const box = $('msgBox');
    box.innerHTML = snap.docs.map(d => {
      const m = d.data(), me = m.senderId === currentUser.uid;
      let mediaHtml = '';
      if (m.mediaType === 'image') mediaHtml = `<img src="${m.mediaUrl}" class="max-w-full rounded-lg mb-1 max-h-64 object-cover">`;
      if (m.mediaType === 'video') mediaHtml = `<video src="${m.mediaUrl}" controls playsinline class="max-w-full rounded-lg mb-1 max-h-64 bg-black"></video>`;
      return `<div class="flex ${me?'justify-end':'justify-start'}"><div class="max-w-[80%] px-3 py-2 rounded-xl shadow-sm text-sm ${me?'bg-[#d9fdd3] dark:bg-[#005c4b]':'bg-white dark:bg-[#202c33]'}">${!me && isGroup ? `<div class="text-[11px] font-bold text-[#075E54] dark:text-[#25D366]">${m.senderName}</div>` : ''}${m.reply ? `<div class="text-[11px] bg-black/10 p-1.5 rounded mb-1 border-l-2 border-[#075E54] truncate">${m.reply}</div>` : ''}${mediaHtml}${m.text ? `<div class="break-words">${m.text}</div>` : ''}<div class="flex justify-end items-center gap-2 mt-1 text-[10px] opacity-60"><button onclick="setReply('${(m.text||m.mediaType||'Media').replace(/'/g,'')}')">Reply</button>${me ? `<button onclick="delMsg('${d.id}')" class="text-red-500">Del</button>` : ''}</div></div></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  });
};

window.closeChat = () => { $('chatScreen').classList.add('hidden'); cancelReply(); };
window.setReply = txt => { replyData = txt; $('replyText').textContent = txt; $('replyBar').classList.remove('hidden'); };
window.cancelReply = () => { replyData = null; $('replyBar').classList.add('hidden'); };
window.delMsg = id => deleteDoc(doc(db, 'rooms', activeChat.roomId, 'messages', id));

window.sendMsg = async () => {
  const txt = $('msgInput').value.trim();
  if (!txt || !activeChat) return;
  $('msgInput').value = ''; const rep = replyData; cancelReply();
  const senderName = currentUser.displayName || 'ChatPro User';
  await addDoc(collection(db, 'rooms', activeChat.roomId, 'messages'), { senderId: currentUser.uid, senderName, text: txt, reply: rep, createdAt: serverTimestamp() });
  if (!activeChat.isGroup) sendPushAlert(activeChat.id, senderName, txt, false);
};

window.sendMedia = e => {
  const file = e.target.files[0];
  if (!file || !activeChat) return;
  if (file.size > 900 * 1024) { alert("Select a photo or short video under 1 MB!"); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const isVid = file.type.startsWith('video'), senderName = currentUser.displayName || 'ChatPro User';
    await addDoc(collection(db, 'rooms', activeChat.roomId, 'messages'), { senderId: currentUser.uid, senderName, mediaUrl: reader.result, mediaType: isVid ? 'video' : 'image', text: '', createdAt: serverTimestamp() });
    if (!activeChat.isGroup) sendPushAlert(activeChat.id, senderName, isVid ? '📹 Sent a video' : '📷 Sent a photo', false);
  };
  reader.readAsDataURL(file); e.target.value = '';
};

function playRingtone() {
  stopRingtone();
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => { const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(520, audioCtx.currentTime); osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.25); gain.gain.setValueAtTime(0.25, audioCtx.currentTime); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5); };
    beep(); ringInterval = setInterval(beep, 1200);
  } catch(e){}
}
function stopRingtone() { if (ringInterval) clearInterval(ringInterval); if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; } }

window.startCall = async type => {
  if (!activeChat || activeChat.isGroup) return;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' });
    $('localVideo').srcObject = localStream; $('localVideo').classList.toggle('hidden', type !== 'video'); $('audioOnlyOverlay').classList.toggle('hidden', type === 'video');
    $('callPeerName').textContent = activeChat.name; $('callStatusTxt').textContent = 'Ringing...'; $('activeCallScreen').classList.remove('hidden');
    const callerName = currentUser.displayName || 'ChatPro User';
    const callRef = await addDoc(collection(db, 'calls'), { callerId: currentUser.uid, callerName, receiverId: activeChat.id, receiverName: activeChat.name, callerPeerId: myPeerId, type, status: 'ringing', createdAt: serverTimestamp() });
    currentCallDocId = callRef.id;
    sendPushAlert(activeChat.id, `Incoming ${type === 'video' ? 'Video' : 'Voice'} Call`, `${callerName} is calling you on ChatPro... Tap to answer!`, true);
    const unsub = onSnapshot(doc(db, 'calls', callRef.id), snap => {
      const data = snap.data();
      if (!data) return;
      if (data.status === 'accepted' && data.receiverPeerId && !currentCallObj) { $('callStatusTxt').textContent = 'Connected'; currentCallObj = peer.call(data.receiverPeerId, localStream); currentCallObj.on('stream', rem => { $('remoteVideo').srcObject = rem; }); }
      else if (data.status === 'rejected' || data.status === 'ended') { unsub(); cleanupCall(); }
    });
  } catch (err) { alert('Allow Camera & Microphone permissions to call!'); }
};

function listenIncomingCalls() {
  onSnapshot(query(collection(db, 'calls'), where('receiverId', '==', currentUser.uid), where('status', '==', 'ringing')), snap => {
    snap.docChanges().forEach(chg => {
      if (chg.type === 'added') { const c = chg.doc.data(); currentCallDocId = chg.doc.id; window.pendingCall = c; $('inCallerName').textContent = c.callerName; $('inCallType').textContent = `Incoming ${c.type} Call...`; $('incomingModal').classList.remove('hidden'); playRingtone(); }
    });
  });
}

window.acceptIncomingCall = async () => {
  stopRingtone(); $('incomingModal').classList.add('hidden'); const c = window.pendingCall; if (!c) return;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: c.type === 'video' });
    $('localVideo').srcObject = localStream; $('localVideo').classList.toggle('hidden', c.type !== 'video'); $('audioOnlyOverlay').classList.toggle('hidden', c.type === 'video');
    $('callPeerName').textContent = c.callerName; $('callStatusTxt').textContent = 'Connecting...'; $('activeCallScreen').classList.remove('hidden');
    await updateDoc(doc(db, 'calls', currentCallDocId), { status: 'accepted', receiverPeerId: myPeerId });
    onSnapshot(doc(db, 'calls', currentCallDocId), snap => { if (snap.data()?.status === 'ended') cleanupCall(); });
  } catch (e) { alert('Camera/Mic permission needed'); rejectIncomingCall(); }
};

window.rejectIncomingCall = async () => { stopRingtone(); $('incomingModal').classList.add('hidden'); if (currentCallDocId) await updateDoc(doc(db, 'calls', currentCallDocId), { status: 'rejected' }).catch(()=>{}); };
window.endActiveCall = async () => { if (currentCallDocId) await updateDoc(doc(db, 'calls', currentCallDocId), { status: 'ended' }).catch(()=>{}); cleanupCall(); };
function cleanupCall() { stopRingtone(); $('activeCallScreen').classList.add('hidden'); $('incomingModal').classList.add('hidden'); if (currentCallObj) { currentCallObj.close(); currentCallObj = null; } if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; } currentCallDocId = null; }
window.toggleMute = () => { if (!localStream) return; isMuted = !isMuted; localStream.getAudioTracks().forEach(t => t.enabled = !isMuted); $('muteBtn').innerHTML = isMuted ? '<i class="fas fa-microphone-slash text-red-400"></i>' : '<i class="fas fa-microphone"></i>'; };
window.openGroupModal = () => { $('grpMembers').innerHTML = allUsers.map(u => `<label class="flex items-center gap-2"><input type="checkbox" value="${u.uid}" class="grpChk"> ${u.name}</label>`).join(''); $('groupModal').classList.remove('hidden'); };
window.createGroup = async () => { const name = $('grpName').value.trim(), members = [currentUser.uid, ...Array.from(document.querySelectorAll('.grpChk:checked')).map(c => c.value)]; if (!name || members.length < 2) return alert('Enter group name & pick members'); await addDoc(collection(db, 'groups'), { name, members, createdAt: serverTimestamp() }); $('groupModal').classList.add('hidden'); };
</script>
