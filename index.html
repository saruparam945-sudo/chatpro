// SOUND EFFECTS FOR LUDO & CALLS
function playTone(freq, dur = 0.12, type = 'triangle') {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch (e) {}
}

async function sendPushAlert(targetUid, title, body, isCall = false) {
  try {
    await fetch("https://api.onesignal.com/notifications", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Key " + OS_API_KEY },
      body: JSON.stringify({
        app_id: OS_APP_ID,
        include_aliases: { external_id: [targetUid] },
        target_channel: "push",
        headings: { en: title },
        contents: { en: body },
        url: "https://saruparam945-sudo.github.io/chatpro/",
        priority: isCall ? 10 : 8
      })
    });
  } catch (e) {}
}

window.enablePush = () => {
  if ("Notification" in window) {
    Notification.requestPermission().then(p => {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.Notifications.requestPermission();
        if (currentUser) await OneSignal.login(currentUser.uid);
      });
      alert(p === 'granted' ? 'Notifications & Ring Alerts Enabled!' : 'Please allow notifications in phone settings.');
    });
  }
};

window.toggleAuthMode = () => {
  isSignup = !isSignup;
  $('nameBox').classList.toggle('hidden', !isSignup);
  $('authBtn').textContent = isSignup ? 'Create Account' : 'Login';
  $('authToggleTxt').textContent = isSignup ? 'Already have an account?' : "Don't have an account?";
  $('authToggleBtn').textContent = isSignup ? 'Login' : 'Sign Up';
};

window.handleAuth = async () => {
  const email = $('authEmail').value.trim(), pass = $('authPass').value.trim(), name = $('authName').value.trim();
  $('authErr').textContent = '';
  try {
    if (isSignup) {
      if (!name) return $('authErr').textContent = 'Enter your name';
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, 'users', cred.user.uid), { uid: cred.user.uid, name, email, online: true });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) { $('authErr').textContent = e.message; }
};

window.logoutUser = () => signOut(auth);
window.toggleDark = () => document.documentElement.classList.toggle('dark');

onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user; window.currentUidForOS = user.uid;
    $('authScreen').classList.add('hidden'); $('mainApp').classList.remove('hidden');
    await setDoc(doc(db, 'users', user.uid), { uid: user.uid, name: user.displayName || user.email.split('@'), email: user.email, online: true }, { merge: true });
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) { await OneSignal.login(user.uid); });
    initPeer(); listenUsersAndGroups(); listenIncomingCalls();
  } else {
    $('authScreen').classList.remove('hidden'); $('mainApp').classList.add('hidden');

function initPeer() {
  peer = new Peer('cp_' + currentUser.uid.slice(0, 12) + '_' + Math.floor(Math.random()*900+100));
  peer.on('open', id => { myPeerId = id; updateDoc(doc(db, 'users', currentUser.uid), { peerId: id }).catch(()=>{}); });
  peer.on('call', call => {
    currentCallObj = call;
    if (localStream) {
      call.answer(localStream);
      call.on('stream', rem => {
        $('remoteVideo').srcObject = rem;
        if ($('ludoVoiceAudio')) $('ludoVoiceAudio').srcObject = rem;
        if ($('watchVoiceAudio')) $('watchVoiceAudio').srcObject = rem;
        $('callStatusTxt').textContent = 'Connected';

    }
  });
}

  onSnapshot(collection(db, 'users'), snap => { allUsers = snap.docs.map(d => d.data()).filter(u => u.uid !== currentUser.uid); if(activeTab==='chats') renderLists(); });

window.joinLudoRoom = async (codeInput) => {
  const code = (codeInput || $('ludoJoinInp').value).trim().toUpperCase();
  if (!code) return alert('Enter Ludo Room Code');
  const ref = doc(db, 'ludo_rooms', code);
  const snap = await getDoc(ref);
  if (!snap.exists()) return alert('Room not found!');
  const data = snap.data();
  const order = ['red','green','yellow','blue'];
  let assigned = order.find(c => data.players[c]?.uid === currentUser.uid);
  if (!assigned) {
    assigned = order.find(c => !data.players[c]);
    if (!assigned) return alert('Room is full (4 players)');
    await updateDoc(ref, { [`players.${assigned}`]: { uid: currentUser.uid, name: currentUser.displayName || 'Player', peerId: myPeerId } });
  }
  myColor = assigned; ludoRoomId = code;
  if (unsubLudo) unsubLudo();
  unsubLudo = onSnapshot(ref, s => {
    if (!s.exists()) return;
    ludoState = s.data();
    renderLudoBoard();
  });
};

window.rollLudoDice = async () => {
  if (!ludoState || ludoState.turn !== myColor || ludoState.rolled || isAnimating) return;
  playTone(520, 0.08); setTimeout(() => playTone(680, 0.1), 80);
  const val = Math.floor(Math.random() * 6) + 1;
  const myTokens = ludoState.tokens[myColor];
  const canMove = myTokens.some(pos => (pos === -1 && val === 6) || (pos >= 0 && pos + val <= 56));
  const order = Object.keys(ludoState.players);
  if (!canMove) {
    await updateDoc(doc(db, 'ludo_rooms', ludoRoomId), { dice: val, rolled: true });
    setTimeout(async () => {
      const nextTurn = order[(order.indexOf(myColor) + 1) % order.length];
      await updateDoc(doc(db, 'ludo_rooms', ludoRoomId), { turn: nextTurn, rolled: false, dice: 0 });
    }, 1100);
  } else {
    await updateDoc(doc(db, 'ludo_rooms', ludoRoomId), { dice: val, rolled: true });
  }
};

window.moveLudoToken = async (color, idx) => {
  if (!ludoState || color !== myColor || ludoState.turn !== myColor || !ludoState.rolled || isAnimating) return;
  const dice = ludoState.dice;
  let pos = ludoState.tokens[color][idx];
  if (pos === -1 && dice !== 6) return;
  if (pos >= 0 && pos + dice > 56) return;

  isAnimating = true;
  const steps = pos === -1 ? 1 : dice;
  let tempTokens = JSON.parse(JSON.stringify(ludoState.tokens));

  // STEP-BY-STEP SLOW MOVEMENT WITH SOUND
  for (let s = 0; s < steps; s++) {
    pos = (pos === -1) ? 0 : pos + 1;
    tempTokens[color][idx] = pos;
    ludoState.tokens = tempTokens;
    playTone(440 + (s * 45), 0.09, 'sine');
    renderLudoBoard();
    await new Promise(r => setTimeout(r, 260));
  }

  if (pos === 56) playTone(880, 0.3, 'triangle');
  const order = Object.keys(ludoState.players);
  const extraTurn = (dice === 6 || pos === 56);
  const nextTurn = extraTurn ? myColor : order[(order.indexOf(myColor) + 1) % order.length];
  isAnimating = false;
  await updateDoc(doc(db, 'ludo_rooms', ludoRoomId), { tokens: tempTokens, turn: nextTurn, rolled: false, dice: 0 });
};

function getCellCoord(color, pos, idx) {
  if (pos === -1) return BASE_SPOTS[color][idx];
  if (pos >= 51) return HOME_PATHS[color][pos - 51];
  const globalIdx = (START_OFFSET[color] + pos) % 52;
  return MAIN_PATH[globalIdx];
}

function renderLudoBoard() {
  const box = $('listArea');
  if (!ludoState) return;
  const tokenMap = {};
  ['red','green','yellow','blue'].forEach(c => {
    if (!ludoState.players[c]) return;
    ludoState.tokens[c].forEach((pos, idx) => {
      const [r, col] = getCellCoord(c, pos, idx);
      const key = `${r},${col}`;
      if (!tokenMap[key]) tokenMap[key] = [];
      tokenMap[key].push({ color: c, idx });
    });
  });

  let cellsHtml = '';
  for (let r = 0; r < 15; r++) {
    for (let c = 0; c < 15; c++) {
      let bg = '#ffffff', star = '';
      // 4 Corner Yards (Classic Ludo King Bright Colors)
      if (r < 6 && c < 6) bg = (r>=1 && r<=4 && c>=1 && c<=4) ? '#ffffff' : '#ef4444';
      else if (r < 6 && c > 8) bg = (r>=1 && r<=4 && c>=10 && c<=13) ? '#ffffff' : '#22c55e';
      else if (r > 8 && c > 8) bg = (r>=10 && r<=13 && c>=10 && c<=13) ? '#ffffff' : '#eab308';
      else if (r > 8 && c < 6) bg = (r>=10 && r<=13 && c>=1 && c<=4) ? '#ffffff' : '#3b82f6';
      // Center Home Crown
      else if (r >= 6 && r <= 8 && c >= 6 && c <= 8) bg = 'linear-gradient(135deg,#ef4444 25%,#22c55e 25%,#22c55e 50%,#eab308 50%,#eab308 75%,#3b82f6 75%)';
      // Colored Home Lanes & Start Squares
      else if ((r === 7 && c >= 1 && c <= 5) || (r === 6 && c === 1)) bg = '#ef4444';
      else if ((c === 7 && r >= 1 && r <= 5) || (r === 1 && c === 8)) bg = '#22c55e';
      else if ((r === 7 && c >= 9 && c <= 13) || (r === 8 && c === 13)) bg = '#eab308';
      else if ((c === 7 && r >= 9 && r <= 13) || (r === 13 && c === 6)) bg = '#3b82f6';

      if (SAFE_CELLS.includes(`${r},${c}`)) star = '<span class="text-gray-400 font-bold text-xs">★</span>';
      const here = tokenMap[`${r},${c}`] || [];
      const tokHtml = here.map(t => {
        const hex = { red:'#dc2626', green:'#16a34a', yellow:'#ca8a04', blue:'#2563eb' }[t.color];
        return `<div onclick="moveLudoToken('${t.color}',${t.idx})" style="background:${hex}" class="token-piece"></div>`;
      }).join('');
      cellsHtml += `<div class="ludo-cell" style="background:${bg}">${tokHtml || star}</div>`;
    }
  }

  const isMyTurn = ludoState.turn === myColor;
  const turnHex = { red:'text-red-600', green:'text-green-600', yellow:'text-yellow-600', blue:'text-blue-600' }[ludoState.turn];
  box.innerHTML = `<div class="p-3 space-y-3">
    <div class="bg-[#075E54] text-white p-3 rounded-xl flex justify-between items-center shadow">
      <div><div class="text-[11px] opacity-75">Room Code</div><div class="font-bold text-lg tracking-widest">${ludoState.code}</div></div>
      <div class="flex gap-2">
        <button id="ludoMicBtn" onclick="toggleLudoMic()" class="px-3 py-1.5 bg-gray-700 rounded-lg text-xs font-bold"><i class="fas fa-microphone-slash"></i> Mic</button>
        <button onclick="ludoRoomId=null;ludoState=null;renderLists()" class="px-3 py-1.5 bg-red-600 rounded-lg text-xs font-bold">Exit</button>
      </div>
    </div>
    <audio id="ludoVoiceAudio" autoplay></audio>
    <div class="ludo-grid rounded-lg overflow-hidden">${cellsHtml}</div>
    <div class="bg-white dark:bg-[#202c33] p-3 rounded-xl shadow flex items-center justify-between border dark:border-gray-700">
      <div>
        <div class="text-xs text-gray-500">Turn: <span class="font-bold uppercase ${turnHex}">${ludoState.turn}</span></div>
        <div class="font-bold text-sm">${isMyTurn ? (ludoState.rolled ? 'Tap your token to move!' : 'Your Turn! Roll Dice') : 'Waiting for opponent...'}</div>
      </div>
      <button onclick="rollLudoDice()" class="px-5 py-3 bg-[#25D366] text-white font-bold rounded-xl shadow active:scale-95 text-base">
        🎲 ${ludoState.dice || 'Roll'}
      </button>
    </div>
  </div>`;
}

function playRingtone() {
  stopRingtone();
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => { const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(520, audioCtx.currentTime); osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.25); gain.gain.setValueAtTime(0.25, audioCtx.currentTime); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5); };
    beep(); ringInterval = setInterval(beep, 1200);
  } catch(e){}
}
function stopRingtone() { if (ringInterval) clearInterval(ringInterval); if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; } }

    const unsub = onSnapshot(doc(db, 'calls', callRef.id), snap => {
      const data = snap.data();
      if (!data) return;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: c.type === 'video' });
    $('localVideo').srcObject = localStream; $('localVideo').classList.toggle('hidden', c.type !== 'video'); $('audioOnlyOverlay').classList.toggle('hidden', c.type === 'video');
    $('callPeerName').textContent = c.callerName; $('callStatusTxt').textContent = 'Connecting...'; $('activeCallScreen').classList.remove('hidden');
    await updateDoc(doc(db, 'calls', currentCallDocId), { status: 'accepted', receiverPeerId: myPeerId });
    onSnapshot(doc(db, 'calls', currentCallDocId), snap => { if (snap.data()?.status === 'ended') cleanupCall(); });
  } catch (e) { alert('Camera/Mic permission needed'); rejectIncomingCall(); }
};

window.rejectIncomingCall = async () => { stopRingtone(); $('incomingModal').classList.add('hidden'); if (currentCallDocId) await updateDoc(doc(db, 'calls', currentCallDocId), { status: 'rejected' }).catch(()=>{}); };
window.endActiveCall = async () => { if (currentCallDocId) await updateDoc(doc(db, 'calls', currentCallDocId), { status: 'ended' }).catch(()=>{}); cleanupCall(); };
function cleanupCall() { stopRingtone(); $('activeCallScreen').classList.add('hidden'); $('incomingModal').classList.add('hidden'); if (currentCallObj) { currentCallObj.close(); currentCallObj = null; } if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; } currentCallDocId = null; }
window.toggleMute = () => { if (!localStream) return; isMuted = !isMuted; localStream.getAudioTracks().forEach(t => t.enabled = !isMuted); $('muteBtn').innerHTML = isMuted ? '<i class="fas fa-microphone-slash text-red-400"></i>' : '<i class="fas fa-microphone"></i>'; };
window.openGroupModal = () => { $('grpMembers').innerHTML = allUsers.map(u => `<label class="flex items-center gap-2"><input type="checkbox" value="${u.uid}" class="grpChk"> ${u.name}</label>`).join(''); $('groupModal').classList.remove('hidden'); };
window.createGroup = async () => { const name = $('grpName').value.trim(), members = [currentUser.uid, ...Array.from(document.querySelectorAll('.grpChk:checked')).map(c => c.value)]; if (!name || members.length < 2) return alert('Enter group name & pick members'); await addDoc(collection(db, 'groups'), { name, members, createdAt: serverTimestamp() }); $('groupModal').classList.add('hidden'); };
</script>
</body>
</html>
